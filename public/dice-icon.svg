<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b66" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9f1239" />
      <stop offset="100%" stop-color="#4c0519" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Aura -->
  <circle cx="60" cy="60" r="50" fill="url(#goldAccent)" opacity="0.15" filter="url(#glow)"/>

  <!-- Isometric 3D Dice -->
  <!-- Top Face -->
  <polygon points="60,20 95,38 60,56 25,38" fill="url(#topFace)" stroke="#f59e0b" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Left Face -->
  <polygon points="25,38 60,56 60,94 25,76" fill="url(#leftFace)" stroke="#f59e0b" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Right Face -->
  <polygon points="60,56 95,38 95,76 60,94" fill="url(#rightFace)" stroke="#f59e0b" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Golden Crown / Edge Highlights -->
  <polyline points="25,38 60,20 95,38" stroke="#fde047" stroke-width="2" fill="none"/>
  <polyline points="60,20 60,56" stroke="#fde047" stroke-width="1.5" fill="none" opacity="0.8"/>

  <!-- Pips (Top Face: 1 pip in center) -->
  <circle cx="60" cy="38" r="4.5" fill="url(#goldAccent)" stroke="#fff" stroke-width="0.75" filter="url(#glow)"/>

  <!-- Pips (Left Face: 2 pips) -->
  <circle cx="40" cy="54" r="3.5" fill="url(#goldAccent)"/>
  <circle cx="48" cy="74" r="3.5" fill="url(#goldAccent)"/>

  <!-- Pips (Right Face: 3 pips) -->
  <circle cx="72" cy="74" r="3.5" fill="url(#goldAccent)"/>
  <circle cx="78" cy="62" r="3.5" fill="url(#goldAccent)"/>
  <circle cx="84" cy="50" r="3.5" fill="url(#goldAccent)"/>

  <!-- Sparkle Accent -->
  <path d="M96 22 Q98 28 104 30 Q98 32 96 38 Q94 32 88 30 Q94 28 96 22 Z" fill="#fde047" filter="url(#glow)"/>
</svg>
